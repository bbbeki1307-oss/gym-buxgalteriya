<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Manager Cloud</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <header>
    <h1>🏋️ GYM MANAGER CLOUD</h1>
    <p>Admin va trenerlar uchun umumiy zal tizimi</p>
  </header>

  <div class="form-box">
    <input type="text" id="name" placeholder="Ism Familiya">
    <input type="text" id="phone" placeholder="Telefon">
    <input type="number" id="fee" placeholder="Oylik">
    <input type="number" id="paid" placeholder="To'langan">
    <button onclick="addMember()">➕ Qo'shish</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Ism</th>
        <th>Telefon</th>
        <th>Qoldi</th>
        <th>Holat</th>
        <th>Kun</th>
        <th>Amal</th>
      </tr>
    </thead>
    <tbody id="memberList"></tbody>
  </table>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
